<div class="layout">
<main id="content">
<section id="music-home" class="music-page-menu" aria-label="音乐首页"><button type="button" class="music-entry" data-music-page="songs"><span class="music-entry-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13M9 7l12-2"/><ellipse cx="6" cy="18" rx="3" ry="3"/><ellipse cx="18" cy="16" rx="3" ry="3"/></svg></span><span class="music-entry-copy"><strong>全部歌曲</strong><small>搜索歌曲、歌手和专辑</small></span><span class="music-entry-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span></button><button type="button" class="music-entry" data-music-page="albums"><span class="music-entry-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></span><span class="music-entry-copy"><strong>专辑</strong><small>按专辑浏览私人乐库</small></span><span class="music-entry-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span></button><button type="button" class="music-entry" data-music-page="playlists"><span class="music-entry-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h7M17 13v7m-3-3 3 3 3-3"/></svg></span><span class="music-entry-copy"><strong>歌单</strong><small>收藏与云端歌单</small></span><span class="music-entry-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span></button><button type="button" class="music-entry" data-music-page="settings"><span class="music-entry-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></span><span class="music-entry-copy"><strong>设置</strong><small>缓存与预加载</small></span><span class="music-entry-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span></button></section>
<section id="playlist-home" class="music-page-menu" aria-label="歌单" hidden><button type="button" class="music-entry playlist-entry" data-music-page="favorites"><span class="music-entry-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg></span><span class="music-entry-copy"><strong>我喜欢</strong></span><span id="fav-count" class="music-entry-count">—</span><span class="music-entry-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></span></button><div id="fixed-playlists"></div></section>
<section id="settings-dialog" class="music-content-page" hidden aria-labelledby="settings-title">
  <div class="settings-head"><div><p class="eyebrow">ROYLYL MUSIC</p><h2 id="settings-title">设置</h2></div><button type="button" id="close-settings" class="icon" aria-label="关闭设置">×</button></div>
  <div class="settings-body">
    <section class="settings-section" aria-labelledby="audio-cache-heading">
      <h3 id="audio-cache-heading">音乐缓存</h3><p class="settings-description">完整保存的歌曲可离线播放。</p>
      <label class="settings-row" for="audio-budget"><span>缓存上限</span><select id="audio-budget"><option value="0">关闭</option><option value="256000000">256MB</option><option value="512000000">512MB</option><option value="1000000000">1GB</option><option value="2000000000">2GB</option><option value="4000000000">4GB</option><option value="8000000000">8GB</option><option value="-1" selected>无限</option></select></label>
      <label class="settings-row preload-option" for="preload-next"><span>预加载下一首<small>提前下载下一首完整音频</small></span><input type="checkbox" role="switch" id="preload-next" checked></label>
      <div class="settings-row cache-action"><p id="audio-cache-status" role="status">正在检查缓存…</p><button type="button" id="clear-audio-cache" class="secondary" aria-label="清理音乐缓存">清理</button></div>
    </section>
    <section class="settings-section"><div class="settings-row"><div><h3>歌词缓存</h3><p class="settings-description">单独保存，更新后重新验证</p></div><button type="button" id="clear-lyric-cache" class="secondary" aria-label="清理歌词缓存">清理</button></div><p id="lyric-cache-status" role="status"></p></section>
    <section class="settings-section"><div class="settings-row"><div><h3>专辑封面缓存</h3><p id="cover-cache-status" role="status">正在检查缓存…</p></div><button type="button" id="clear-cover-cache" class="secondary" aria-label="清理专辑封面缓存">清理</button></div></section>
  </div>
</section>

<section class="library" id="library" hidden><button class="back" id="back-albums" type="button" hidden>← 返回专辑收藏</button><div id="album-detail" hidden></div><div class="section-heading"><div><p class="eyebrow">YOUR COLLECTION</p><h2 id="view-title">专辑收藏</h2></div><div class="search-tools"><button type="button" id="reset-view-filters" class="back reset-view-filters" hidden>清空筛选</button><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索歌曲、歌手、专辑" aria-label="搜索歌曲、歌手或专辑"><kbd>/</kbd></label></div></div>
<div class="filters"><label>歌手<select id="artist"><option value="">全部歌手</option></select></label><label>第一顺序<select id="sort-primary"><option value="default" disabled hidden>默认排序</option><option value="release">发行时间</option><option value="artist">歌手</option><option value="name">名称</option></select></label><label>第二顺序<select id="sort-secondary"><option value="none">不设置</option><option value="release">发行时间</option><option value="artist">歌手</option><option value="name">名称</option></select></label><label>方向<select id="sort-direction"><option value="asc">升序</option><option value="desc">降序</option></select></label><span id="result-count"></span></div>
<div class="notice" id="notice" role="status">正在载入音乐收藏…</div><button id="retry" class="secondary" hidden>重新连接</button>
<div id="playlist-detail" hidden></div><div id="albums" class="album-grid"></div><div id="songs" hidden></div><div id="empty" class="empty" hidden><span>♫</span><h3>这里还很安静</h3><p>试试其他关键词，或查看Apple Music固定歌单。</p><button type="button" id="clear-filters" class="secondary" hidden>清空筛选</button></div>
</section>
</main></div>
<button type="button" id="queue-backdrop" class="music-queue-backdrop" aria-label="关闭播放队列" hidden></button><aside id="queue-panel" class="queue-panel" aria-label="播放队列" hidden><div class="queue-head"><div><p class="eyebrow">UP NEXT</p><h2>播放队列</h2></div><button id="close-queue" class="icon" aria-label="关闭播放队列">×</button></div><div id="queue-list"></div></aside>
<div id="track-more-menu" class="track-more-menu" role="menu" aria-label="歌曲更多选项" hidden><button id="share-track" type="button" role="menuitem">分享歌曲</button><button id="download-track" type="button" role="menuitem">下载</button><button type="button" id="menu-album" role="menuitem">查看专辑</button><div id="menu-artists" role="group" aria-label="歌手"></div><button type="button" id="cancel-insertion" role="menuitem" hidden>取消此次插队</button><button type="button" id="clear-insertions" role="menuitem" hidden>清空待插队</button></div>
<div id="feedback-stack" class="feedback-stack" aria-label="操作提示"></div>
<div id="favorite-notice" class="favorite-notice" role="status" aria-live="polite" hidden></div>
<footer class="player" aria-label="音乐播放器"><div class="now"><button id="open-full" class="cover-button" aria-label="打开全屏播放" disabled><img id="now-cover" src="./placeholder.svg" alt="" width="56" height="56"></button><button type="button" id="open-full-copy" class="now-copy" aria-label="打开正在播放的歌曲"><span class="now-title-line"><strong id="now-title">选一首，慢慢听</strong><span id="player-status" role="status" class="player-status"></span></span><span id="now-artist">你的音乐，从这里开始</span></button><button id="now-like" class="icon" aria-label="喜欢当前歌曲" aria-pressed="false" disabled>♡</button></div><div class="transport"><div class="controls"><button id="prev" class="icon" aria-label="上一首">◀Ⅰ</button><button id="play" class="play" aria-label="播放">▶</button><button id="next" class="icon" aria-label="下一首">Ⅰ▶</button><button id="repeat" class="icon small mode-button" aria-label="播放模式：列表循环" aria-pressed="false" title="播放模式：列表循环">↻</button><button id="mobile-queue-toggle" class="icon" aria-label="播放队列" aria-expanded="false" aria-controls="queue-panel">☷</button></div><div class="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="播放进度" disabled><span id="duration">0:00</span></div></div><div class="player-extra"><button id="quality" class="quality" aria-label="查看音频参数" disabled>音频信息</button><label class="volume">音量<input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量"></label><button id="queue-toggle" class="icon" aria-label="播放队列" aria-expanded="false" aria-controls="queue-panel">☷</button></div></footer>
<dialog id="full-player" aria-labelledby="full-title">
<div class="full-shell" data-mobile-view="cover"><header class="full-header"><span>Roylyl Music / NOW PLAYING</span><button id="close-full" class="icon" aria-label="退出全屏播放">⌄</button></header><div class="full-view-bar"><div class="full-tabs" role="tablist" aria-label="全屏播放页面"><button type="button" id="full-cover-tab" class="full-tab is-active" role="tab" aria-selected="true" aria-controls="full-content">封面</button><button type="button" id="full-lyrics-tab" class="full-tab" role="tab" aria-selected="false" aria-controls="full-content">歌词</button></div><button type="button" id="full-more" class="icon full-share" aria-label="更多播放选项" title="更多播放选项" aria-haspopup="menu" aria-expanded="false" aria-controls="full-more-menu"></button><div id="full-more-menu" class="track-more-menu full-more-menu" role="menu" hidden><button id="full-share-action" type="button" role="menuitem">分享</button><button id="full-download-action" type="button" role="menuitem">下载</button><button id="open-sleep-timer" type="button" role="menuitem">定时关闭</button><button id="full-menu-album" type="button" role="menuitem">查看专辑</button><div id="full-menu-artists" role="group" aria-label="歌手"></div><button type="button" id="full-clear-insertions" role="menuitem" hidden>清空待插队</button></div><span id="full-share-status" class="full-share-status" role="status" hidden></span></div>
<div id="full-content" class="full-content"><img id="full-cover" src="./placeholder.svg" alt="当前专辑封面"><section class="full-info"><div class="full-meta"><p class="eyebrow">正在播放</p><div class="full-title-row"><h2 id="full-title"></h2><div id="quality-badges" class="quality-badges" aria-label="音频信息"></div></div><p id="full-artist"></p><p id="full-album"></p><button id="full-like-mobile" class="icon" aria-label="喜欢当前歌曲" aria-pressed="false">♡</button><dl id="audio-details"></dl><p class="audio-note">参数描述音源文件，蓝牙传输规格取决于设备。</p><span id="full-status" role="status" aria-live="polite"></span></div><section id="full-lyrics" class="full-lyrics" aria-label="滚动歌词" aria-live="off" tabindex="0"><p class="lyrics-placeholder">正在载入歌词…</p></section></section></div>
<div class="full-transport"><div class="full-timeline"><span id="full-elapsed">0:00</span><input id="full-seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="全屏播放进度" disabled><span id="full-duration">0:00</span></div>
<div class="full-controls"><button id="full-prev" class="icon" aria-label="全屏上一首">◀Ⅰ</button><button id="full-play" class="play" aria-label="全屏播放">▶</button><button id="full-next" class="icon" aria-label="全屏下一首">Ⅰ▶</button><button id="full-repeat" class="icon mode-button" aria-label="播放模式：列表循环" aria-pressed="false" title="播放模式：列表循环">↻</button><button id="full-like" class="icon" aria-label="喜欢全屏歌曲" aria-pressed="false">♡</button><button id="full-queue-toggle" class="icon" aria-label="打开播放列表" aria-expanded="false" aria-controls="full-queue">☷</button></div></div><button type="button" id="full-queue-backdrop" class="music-queue-backdrop" aria-label="关闭播放列表" hidden></button><section id="full-queue" class="full-queue" aria-label="播放列表" hidden><div class="queue-head"><h2>播放列表</h2><button id="full-queue-close" class="icon" aria-label="关闭播放列表">×</button></div><div id="full-queue-list"></div></section></div>
<dialog id="sleep-dialog" aria-labelledby="sleep-title"><div class="queue-head"><h2 id="sleep-title">定时关闭</h2><button id="close-sleep-timer" class="icon" type="button" aria-label="关闭定时设置"></button></div><p class="sleep-description">到时暂停播放，保留当前进度。</p><p id="sleep-current"></p><div class="sleep-presets"><button class="secondary" type="button" data-sleep-minutes="30">30分钟</button><button class="secondary" type="button" data-sleep-minutes="60">1小时</button><button class="secondary" type="button" data-sleep-minutes="120">2小时</button><button class="secondary" type="button" data-sleep-minutes="180">3小时</button></div><form id="sleep-custom-form"><label for="sleep-minutes">自定义时间（分钟）</label><div class="sleep-custom"><input id="sleep-minutes" type="number" inputmode="numeric" min="1" max="1440" step="1" placeholder="输入分钟数" required><button class="primary" type="submit">开启定时</button></div></form><button id="cancel-sleep-timer" class="secondary" type="button">取消定时</button></dialog>
</dialog>

<div id="queue-undo" class="queue-undo" role="status" hidden><span id="queue-undo-text"></span><button type="button" id="undo-queue-change">撤销</button></div>
<div id="playback-recovery" class="playback-recovery" role="status" hidden><span id="playback-recovery-text">播放失败</span><button type="button" id="retry-playback">重试</button><button type="button" id="skip-playback">跳过</button></div>
<audio id="audio" preload="none"></audio>
